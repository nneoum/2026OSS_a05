<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: antiquewhite;
            max-width: 600px;
            margin: 30px;
        }

        div {
            margin: 15px;
        }

        p {
            margin-left: 40px;
            padding-left: 30px;
        }

        button {
            margin: 5px;
            padding: 10px;
        }

        ul {
            list-style: none;
        }

        li {
            padding: 10px;
        }

        li button:nth-of-type(1):hover {
            background: rgb(126, 239, 149);
        }

        li button:nth-of-type(2):hover {
            background: rgb(230, 108, 108);
        }
    </style>

    <script>
        //도서관리 
        let books = [
            {
                id: 1,
                title: "HTML",
                author: "Kim",
                category: "Web",
                price: 10000,
                year: 1999
            },
            {
                id: 2,
                title: "CSS",
                author: "Lee",
                category: "Web",
                price: 12000,
                year: 2010
            },
            {
                id: 3,
                title: "JavaScript",
                author: "Park",
                category: "Web",
                price: 15000,
                year: 2020
            }
        ];

        // -------------------------

        window.addEventListener("load", function () {
            const title = document.querySelector("#title");
            const author = document.querySelector("#author");
            const category = document.querySelector("#category");
            const price = document.querySelector("#price");
            const year = document.querySelector("#year");
            const add = document.querySelector("#add");
            const list = document.querySelector("#list");

            let idAdd = 4;
            let editId = null;

            function loading() {
                list.innerHTML = "";
                books.forEach(function (book) {
                    const li = document.createElement("li");
                    li.textContent = book.id + " " + book.title + " " + book.author + " " + book.category + " " + book.price + " " + book.year;

                    const edtBtn = document.createElement("button");
                    edtBtn.textContent = "수정";

                    edtBtn.addEventListener("click", function () {
                        title.value = book.title;
                        author.value = book.author;
                        category.value = book.category;
                        price.value = book.price;
                        year.value = book.year;
                        editId = book.id;
                        add.textContent = "저장";
                    });

                    add.textContent = "[Add]";

                    const dltBtn = document.createElement("button");
                    dltBtn.textContent = "삭제";

                    dltBtn.addEventListener("click", function () {
                        if (confirm("삭제?")) {
                            books = books.filter(function (b) {
                                return b.id !== book.id;
                            });

                            //수정 중 삭제 시 입력칸 안비우는 것만 문제가 아님
                            //수정하고 있는 과정에서 삭제하니까 신규 등록이 안됨
                            if (editId === book.id) {
                                editId = null;
                                add.textContent = "[Add]";
                                title.value = author.value = category.value = price.value = year.value = "";
                            }

                            loading();
                        }
                    });

                    li.appendChild(edtBtn);
                    li.appendChild(dltBtn);
                    list.appendChild(li);
                });
            }
            loading();

            function validation() {
                if (title.value.trim() == "") {
                    alert("제목입력");
                    title.focus();
                    return false;
                }

                if (author.value.trim() == "") {
                    alert("저자입력");
                    author.focus();
                    return false;
                }

                if (author.value.trim().length < 2) {
                    alert("저자 : 2자 이상 입력");
                    author.focus();
                    return false;
                }


                if (category.value.trim() == "") {
                    alert("분류입력");
                    category.focus();
                    return false;
                }
                if (price.value.trim() == "" || Number(price.value) < 1 || isNaN(price.value)) {
                    alert("가격은 1 이상 숫자로 입력");
                    price.focus();
                    return false;
                }
                if (year.value.trim() == "" || Number(year.value) < 1900 || Number(year.value) > 2026 || isNaN(year.value)) {
                    alert("연도는 1900 ~ 2026 사이 숫자로 입력");
                    year.focus();
                    return false;
                }

                return true;
            }

            add.addEventListener("click", function () {
                if (!validation()) return;

                if (editId == null) {

                    books.push(
                        {
                            id: idAdd,
                            title: title.value.trim(),
                            author: author.value.trim(),
                            category: category.value.trim(),
                            price: Number(price.value),
                            year: Number(year.value)
                        })
                    idAdd++;
                } else {
                    const target = books.find(function (b) {
                        return b.id === editId;
                    });
                    target.title = title.value.trim();
                    target.author = author.value.trim();
                    target.category = category.value.trim();
                    target.price = Number(price.value);
                    target.year = Number(year.value);
                    editId = null;
                }

                title.value = author.value = category.value = price.value = year.value = "";
                loading();
            });
        });

        //--------------------

    </script>
</head>

<body>
    <h1> book management </h1>
    <div> 제목
        <input type="text" id="title">
    </div>
    <div> 저자
        <input type="text" id="author">
    </div>
    <div> 분류
        <input type="text" id="category">
    </div>
    <div> 가격
        <input type="text" id="price">
    </div>
    <div> 연도
        <input type="text" id="year">
    </div>

    <button id="add"> [Add] </button>

    <p> ID 제목 저자 분류 가격 연도 </p>

    <ul id="list"> </ul>
</body>

</html>
