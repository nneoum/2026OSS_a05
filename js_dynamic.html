<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        window.addEventListener("load", function(){
            const name = document.querySelector("#name"); //글자입력해서받아오는애
            const add = document.querySelector("#add"); //이벤트용
            const list = document.querySelector("#list"); //추가용

            add.addEventListener("click", function(){
                const plist = document.createElement("text");
                plist.textContent = "등록 목록";
                //for(let i = 0; i< flist.length; i++){
                    const li = document.createElement("li");
                    li.textContent = name.value + "+";
                    //li.textContent = flist[i];
                    list.appendChild(li);
            });
        });
    </script>
</head>

<body>
    <h1> 사용자 등록 </h1>
    <div> 이름 </div>
    <input type ="text" id = "name">

    <div> Email </div>
    <input type ="text" id = "email">

    <button id = "add"> 등록</button>

    <ul id = "list"> </ul>
</body>
</html>
