<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박동민 자기소개</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
            background: radial-gradient(circle at 15% 10%, #24314f 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, #2c2350 0%, transparent 45%),
                linear-gradient(135deg, #1f2937, #0b1120);
            background-attachment: fixed;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            padding: 56px 16px;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 720px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.75), rgba(17, 24, 39, 0.75));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 24px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            padding: 44px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(96, 165, 250, 0.04);
            overflow: hidden;
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -2px;
            padding: 2px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.5), rgba(167, 139, 250, 0.15), transparent 60%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
            animation: fadeUp 0.6s ease 0.1s both;
        }

        .profile .avatar-ring {
            position: relative;
            width: 116px;
            height: 116px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #60a5fa);
            background-size: 200% 200%;
            animation: ringSpin 6s linear infinite;
            flex-shrink: 0;
        }

        @keyframes ringSpin {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 200% 50%;
            }
        }

        .profile img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #111827;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .profile .avatar-ring:hover img {
            transform: scale(1.06);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 33px;
            font-weight: 900;
            background: linear-gradient(90deg, #f3f4f6, #93c5fd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }

        .profile p {
            margin: 3px 0;
            color: #9ca3af;
            font-size: 14.5px;
        }

        .section {
            animation: fadeUp 0.6s ease both;
        }

        .section:nth-of-type(1) {
            animation-delay: 0.18s;
        }

        .section:nth-of-type(2) {
            animation-delay: 0.26s;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            border-left: 4px solid #60a5fa;
            padding-left: 12px;
            margin-top: 36px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h3 {
            font-size: 16px;
            font-weight: 700;
            color: #93c5fd;
            margin: 16px 0 8px;
        }

        .section p {
            line-height: 1.7;
            color: #d1d5db;
        }

        ul {
            padding-left: 20px;
            margin: 8px 0;
        }

        li {
            margin-bottom: 6px;
            color: #e5e7eb;
        }

        .badge-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge-list li {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.16), rgba(167, 139, 250, 0.12));
            border: 1px solid rgba(96, 165, 250, 0.28);
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .badge-list li:hover {
            transform: translateY(-2px);
            border-color: rgba(96, 165, 250, 0.6);
            box-shadow: 0 6px 16px rgba(96, 165, 250, 0.18);
        }

        .project-box {
            position: relative;
            background: rgba(32, 43, 64, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-left: 3px solid #60a5fa;
            border-radius: 14px;
            padding: 22px 24px;
            margin-top: 10px;
            transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
        }

        .project-box:hover {
            background: rgba(37, 49, 74, 0.75);
            border-left-color: #a78bfa;
            transform: translateY(-2px);
        }

        a.link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 28px;
            padding: 11px 22px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: #0f172a;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14.5px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        a.link-btn:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(59, 130, 246, 0.45);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="profile">
            <div class="avatar-ring">
                <img src="https://ui-avatars.com/api/?name=Dongmin+Park&size=200&background=60a5fa&color=0f172a&bold=true"
                    alt="박동민 프로필 이미지">
            </div>
            <div>
                <h1>박동민</h1>
                <p>학번: 22300272</p>
                <p>전공: 전산심화</p>
            </div>
        </div>

        <div class="section">
            <h2>관심 분야 &amp; 취미</h2>
            <ul class="badge-list">
                <li>🏋️ 헬스</li>
            </ul>
        </div>

        <div class="section">
            <h2>만들어보고 싶은 프로젝트</h2>
            <div class="project-box">
                <h3>AI 기반 맞춤형 헬스 루틴 추천 서비스</h3>
                <p>
                    전산심화 전공 지식과 헬스에 대한 관심을 결합해, 사용자의 운동 기록과 신체 데이터를
                    분석하여 개인 맞춤형 루틴을 추천해주는 웹/앱 서비스를 만들어보고싶다.
                </p>
            </div>
        </div>

        <div class="section">
            <h2>페이지 이동</h2>
            <p>
                <a class="link-btn" href="style1.html">Style 1</a>
                <a class="link-btn" href="style2.html">Style 2</a>
                <a class="link-btn" href="nostyle.html">No Style</a>
                <a class="link-btn" href="js_dynamic.html">JS dynamic</a>
                <a class="link-btn" href="crud.html">crud book</a>
                
            </p>
        </div>
    </div>

    </div>
</body>

</html>
