<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function add() {
            const num1 =
                document.querySelector("#num1").value;

            const num2 =
                document.querySelector("#num2").value;

            const result =
                Number(num1) + Number(num2);

            document.querySelector("#result").value = result;
        }

        //const addBtn = documAent.getElementById("addBtn");

        const btn = document.querySelector("#clickBtn");

        function clickMe() {
            const btn = document.querySelector("#clickBtn");
            btn.innerHTML = "<h1> button clicked </h1>"
            alert("its clicked");
        }

        window.addEventListener("load", function () {
            //위로 모을 수 있음
            const clickBtn2 = document.querySelector("#clickBtn2");
            clickBtn2.addEventListener("click", function (event) {
                //event 든 뭐든 이름 상관없이 브라우저가 알아서 이벤트를 넣어줌.
                //"click" 이건 onclick 처럼 정해져있는거라 상관있음. 
                clickBtn2.innerHTML = "<h1> button clicked </h1>";
            });
        });

    </script>
</head>

<body>
    <!-- click Btn practice. (Internal JS)-->
    <button id="clickBtn2s"> click me </button>


    <!-- click Btn practice. (Inline JS) -->
    <button id="clickBtn" onclick="cleickMe()"> click me </button>


    <!-- Calculator practice. -->
    <h1> 덧셈 계산기 </h1>
    <input type="text" id="num1" size="4" />
    <input type="text" id="num2" size="4" />
    <button id="addBtn" onclick="add()"> + </button>
    <input id="result" size="4" />
</body>

</html>
