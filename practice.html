<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function clickme() {
            alert('Hello');
        }

        function clickme3() {
            alert('Hello3');
        }

        function checkForm(e) {
            const username = document.querySelector("#username");
            if (username.value == '') {
                alert('이름을 입력하세요');
                username.focus();
                e.preventDefault();
            }
        }

        window.addEventListener("load", function () {
            const btn1 = document.querySelector("#btn1");
            btn1.addEventListener("click", clickme);

            const form1 = document.querySelector("#form1");
            form1.addEventListener("submit", checkForm);
        });
    </script>
</head>

<body>
    <button id="btn1">
        Click1
    </button>

    <button id="btn2">
        click2
    </button>

    <button id="btn3" onclick="clickme3()">
        click3
    </button>

    <form id="form1" action="login_ok.html" method="post">
        <input id="username" type="text" name="username" placeholder="이름입력">
        <input type="submit" value="login">
    </form>

</body>

</html>



<script>
    function clickme2() {
        alert('Hello2');
